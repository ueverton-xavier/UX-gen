<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="theme-color" content="#1f2c34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>UXIA</title>
<style>
  :root {
    --bg:#0b141a; --bar:#1f2c34; --me:#005c4b; --bot:#1f2c34; --txt:#e9edef; --mut:#8696a0;
    --acc:#00a884; --err:#ff7a7a; --input:#2a3942;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bar); }
  .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#00a884,#7c9cff); display:grid; place-items:center; font-weight:800; color:#0b141a; }
  header .who { flex:1; min-width:0; }
  header .name { font-weight:600; background:none; border:0; color:var(--txt); font:inherit; font-weight:600; padding:0; display:flex; align-items:center; gap:4px; max-width:100%; }
  header .name span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .name svg { width:18px; height:18px; fill:var(--mut); flex:none; }
  .models { display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto; }
  .opt { display:flex; gap:10px; align-items:flex-start; text-align:left; background:var(--input); border:2px solid transparent; border-radius:10px; padding:10px; color:var(--txt); font:inherit; }
  .opt.sel { border-color:var(--acc); }
  .opt b { display:block; }
  .opt small { color:var(--mut); }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#103529; color:#7fe0bf; margin-left:6px; }
  .tag.v { background:#2d2340; color:#c8b4ff; }
  header .sub { font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon { background:none; border:0; color:var(--mut); padding:8px; border-radius:50%; display:grid; place-items:center; }
  .icon svg { width:22px; height:22px; fill:currentColor; }
  #chat { flex:1; overflow-y:auto; padding:12px 10px 4px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:82%; padding:6px 8px 4px; border-radius:10px; word-wrap:break-word; position:relative; }
  .me { align-self:flex-end; background:var(--me); border-top-right-radius:2px; }
  .bot { align-self:flex-start; background:var(--bot); border-top-left-radius:2px; }
  .sys { align-self:center; background:#182229; color:var(--mut); font-size:12.5px; padding:6px 10px; border-radius:8px; max-width:92%; text-align:center; }
  .msg video { display:block; width:100%; max-width:320px; border-radius:8px; margin-bottom:4px; background:#000; }
  .msg img { display:block; width:100%; max-width:320px; border-radius:8px; margin-bottom:4px; }
  .msg .t { white-space:pre-wrap; }
  .msg .time { font-size:11px; color:rgba(233,237,239,.6); text-align:right; margin-top:2px; }
  .msg.err .t { color:var(--err); }
  .acts { display:flex; gap:6px; margin-top:4px; }
  .acts button { flex:1; background:rgba(255,255,255,.08); color:var(--txt); border:0; border-radius:8px; padding:8px 6px; font-size:13px; }
  .typing span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--mut); animation:b 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes b { 0%,60%,100%{opacity:.3; transform:translateY(0)} 30%{opacity:1; transform:translateY(-3px)} }
  #preview { display:none; align-items:center; gap:8px; padding:8px 12px; background:var(--bar); border-top:1px solid #2a3942; }
  #preview img { width:48px; height:48px; object-fit:cover; border-radius:6px; }
  #preview .lbl { flex:1; font-size:13px; color:var(--mut); }
  footer { display:flex; align-items:flex-end; gap:6px; padding:8px; background:var(--bg); }
  .box { flex:1; display:flex; align-items:flex-end; background:var(--input); border-radius:22px; padding:2px 4px 2px 12px; }
  textarea { flex:1; background:none; border:0; color:var(--txt); font:inherit; resize:none; max-height:120px; padding:10px 0; outline:none; }
  #send { width:46px; height:46px; border-radius:50%; border:0; background:var(--acc); color:#0b141a; display:grid; place-items:center; flex:none; }
  #send svg { width:22px; height:22px; fill:currentColor; }
  #send:disabled { opacity:.5; }
  dialog { background:var(--bar); color:var(--txt); border:0; border-radius:14px; width:min(92vw,420px); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { font-size:17px; margin:0 0 8px; }
  dialog label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  dialog select, dialog input { width:100%; background:var(--input); color:var(--txt); border:0; border-radius:8px; padding:10px; font:inherit; }
  dialog .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  dialog .ok { width:100%; margin-top:14px; padding:12px; border:0; border-radius:10px; background:var(--acc); color:#0b141a; font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="avatar">U</div>
  <div class="who">
    <button class="name" id="pick" aria-label="Escolher modelo"><span id="mname">FLUX.1 [dev]</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
    <div class="sub" id="sub">online · nada é salvo neste aparelho</div>
  </div>
  <button class="icon" id="clear" aria-label="Limpar conversa"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
  <button class="icon" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
</header>

<div id="chat"></div>

<div id="preview">
  <img alt="">
  <div class="lbl" id="plbl">Imagem anexada — escreva o pedido</div>
  <button class="icon" id="unattach" aria-label="Remover anexo"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
</div>

<footer>
  <div class="box">
    <textarea id="text" rows="1" placeholder="Mensagem"></textarea>
    <button class="icon" id="clip" aria-label="Anexar imagem"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg></button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></button>
</footer>

<dialog id="picker">
  <h2>Escolha o modelo</h2>
  <div class="models" id="models"></div>
  <label for="custom">Outro Space do Hugging Face (dono/nome)</label>
  <input id="custom" autocomplete="off" placeholder="ex.: Lightricks/ltx-video-distilled">
  <button class="ok" id="okpick">Usar</button>
</dialog>

<dialog id="settings">
  <h2>Ajustes</h2>
  <label for="size">Formato (modelos de imagem)</label>
  <select id="size">
    <option value="1024x1024">Quadrado 1024×1024</option>
    <option value="768x1344">Retrato 768×1344</option>
    <option value="1344x768">Paisagem 1344×768</option>
  </select>
  <div class="row">
    <div><label for="steps">Passos (vazio = padrão)</label><input id="steps" type="number" min="1" max="50" placeholder="auto"></div>
    <div><label for="seed">Seed (vazio = aleatória)</label><input id="seed" type="number" min="0" placeholder="aleatória"></div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--txt)">
    <input id="realista" type="checkbox" checked style="width:auto"> Estilo realista (quando o modelo tiver opção de estilo)
  </label>
  <label for="token">Token do Hugging Face (opcional, aumenta a cota; fica só na memória)</label>
  <input id="token" type="password" autocomplete="off" placeholder="hf_...">
  <label for="pollkey">Chave Pollinations (opcional — enter.pollinations.ai)</label>
  <input id="pollkey" type="password" autocomplete="off" placeholder="pk_... ou sk_...">
  <label for="togkey">Chave Together AI (api.together.ai)</label>
  <input id="togkey" type="password" autocomplete="off" placeholder="chave da Together">
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--txt)">
    <input id="autofb" type="checkbox" checked style="width:auto"> Trocar de provedor sozinho quando a cota acabar
  </label>
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--txt)">
    <input id="remember" type="checkbox" style="width:auto"> Lembrar token e chaves neste aparelho
  </label>
  <label style="display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--txt)">
    <input id="keephist" type="checkbox" style="width:auto"> Guardar conversa neste aparelho
  </label>
  <small style="color:var(--mut);display:block;margin-top:4px">Só grava o que estiver marcado. Desmarque e toque em Pronto para apagar do aparelho.</small>
  <button class="ok" id="okset">Pronto</button>
  <button class="ok" id="diag" style="background:transparent;color:var(--acc);border:1px solid var(--acc)">🔍 Testar conexão do modelo atual</button>
</dialog>

<script type="module">
const VERSAO = "v16";
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client@2.7.1/dist/browser.js";

// Catálogo de modelos (Spaces públicos do Hugging Face). "aceita": o que o modelo recebe.
const MODELS = [
  { id: "flux-dev",     nome: "FLUX.1 [dev]",     tipo: "imagem", aceita: "texto",  space: "black-forest-labs/FLUX.1-dev",        desc: "Melhor qualidade de imagem" },
  { id: "flux-schnell", nome: "FLUX.1 [schnell]", tipo: "imagem", aceita: "texto",  space: "black-forest-labs/FLUX.1-schnell",    desc: "Imagem em segundos" },
  { id: "flux-kontext", nome: "FLUX.1 Kontext",   tipo: "imagem", aceita: "imagem", space: "black-forest-labs/FLUX.1-Kontext-Dev", desc: "Edita uma imagem anexada" },
  { id: "cogvideox",    nome: "CogVideoX 5B",     tipo: "vídeo",  aceita: "ambos",  space: "THUDM/CogVideoX-5B-Space",            desc: "Vídeo a partir de texto ou imagem" },
  { id: "animatediff",  nome: "AnimateDiff Lightning", tipo: "vídeo", aceita: "texto", space: "ByteDance/AnimateDiff-Lightning", desc: "Vídeo curto/loop rápido a partir de texto" },
  { id: "ltx",          nome: "LTX-Video",        tipo: "vídeo",  aceita: "ambos",  space: "Lightricks/ltx-video-distilled",      desc: "Vídeo rápido a partir de texto ou imagem" },
  { id: "poll-flux",    nome: "FLUX (Pollinations)", tipo: "imagem", aceita: "texto", prov: "pollinations", space: "pollinations.ai", desc: "Outro provedor, cota própria (chave opcional)" },
  { id: "tog-schnell",  nome: "FLUX schnell (Together)", tipo: "imagem", aceita: "texto", prov: "together", space: "api.together.xyz", desc: "Outro provedor, endpoint grátis (precisa chave)" },
];
// Ordem de troca automática quando a cota do Hugging Face acaba (só texto → imagem).
const FALLBACK = ["poll-flux", "tog-schnell"];
let model = MODELS[0];

// Travas exigidas pelas licenças e pela lei:
// 1) nada sexual envolvendo menores; 2) nada de nudez/sexo a partir de foto anexada (pessoa real, sem consentimento verificável).
const W = (s) => new RegExp(`(?<![\\p{L}\\d])(${s})(?![\\p{L}\\d])`, "iu");
const MINOR = W("crian[cç]as?|menin[oa]s?|menor(es)? de idade|infantil|beb[eê]s?|adolescentes?|novinh[oa]s?|colegial|child(ren)?|kids?|minors?|underage|teens?|teenagers?|toddlers?|loli|shota|preteen|schoolgirl|schoolboy|(?:[1-9]|1[0-7])\\s*(anos|years?\\s*old|yo)");
// Despir: verbo de tirar/remover + peça de roupa, em PT e EN (ex.: "retirando o sutiã", "taking off her bra").
const UNDRESS = /(?<![\p{L}])(re)?(tir|remov|desabot|abaix|arranc|desamarr|solt|deix)\p{L}*\s+(\p{L}+\s+){0,3}(sutiã|sutia|roupas?|calcinhas?|biqu[ií]nis?|bikinis?|lingeries?|top|blusas?|camisas?|saias?|shorts?|vestidos?|cal[cç]as?|maiôs?|pe[cç]as?)(?![\p{L}])|(?<![\p{L}])(tak\p{L}* off|remov\p{L}*|strip\p{L}*|pull\p{L}* (down|off)|unhook\p{L}*|unbutton\p{L}*|slip\p{L}* off)\s+(\p{L}+\s+){0,3}(bra|top|shirt|clothes|clothing|panties|bikini|lingerie|dress|skirt|pants|underwear|swimsuit)s?(?![\p{L}])|(?<![\p{L}])(strip\p{L}*|strip-?tease|desnud\p{L}*|se despe|se despindo|fica\p{L}* (nu|nua|pelad[oa]))(?![\p{L}])/iu;
const SEXUAL = W("nu[ae]?s?|nudez|pelad[oa]s?|despi\\w*|tir[ae]\\w* a roupa|sem roupa|sexo|sexual|er[oó]tic[oa]|porn\\w*|nsfw|nude|naked|undress\\w*|sex\\w*|erotic|topless|lingerie|bikini|biqu[ií]ni|transparen\\w*|see[- ]?through|sheer|explicit");

const $ = (id) => document.getElementById(id);
const chat = $("chat");
const urls = new Set();          // object URLs vivos (revogados ao limpar)
let attached = null;             // Blob anexado aguardando envio
// Imagens que o próprio app gerou só a partir de texto (ou derivadas delas): sabidamente fictícias.
// Arquivos enviados pelo clipe nunca entram aqui — marca d'água/assinatura não prova que não é pessoa real.
const FICTIONAL = new WeakSet();
// Identidade de arquivos salvos: ao tocar "Salvar" numa imagem fictícia, guarda só a impressão digital
// (SHA-256 dos bytes, não a imagem). Se o mesmo arquivo voltar pelo clipe, é reconhecido.
const HASH_KEY = "uxia_fictional_hashes";
async function sha256(blob) {
  const d = await crypto.subtle.digest("SHA-256", await blob.arrayBuffer());
  return [...new Uint8Array(d)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
function loadHashes() { try { return JSON.parse(localStorage.getItem(HASH_KEY) || "[]"); } catch { return []; } }
async function rememberFictional(blob) {
  try {
    const h = await sha256(blob);
    const list = loadHashes().filter((x) => x !== h); list.push(h);
    localStorage.setItem(HASH_KEY, JSON.stringify(list.slice(-1000)));
  } catch {}
}
async function isKnownFictional(blob) {
  try { return loadHashes().includes(await sha256(blob)); } catch { return false; }
}
const clients = {};

const now = () => new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const scroll = () => chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
const objUrl = (blob) => { const u = URL.createObjectURL(blob); urls.add(u); return u; };
const isVideo = (blob) => blob.type.startsWith("video/");

function bubble(cls, { text, img, video, actions, time } = {}) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  if (img) { const i = document.createElement("img"); i.src = img; i.alt = ""; el.append(i); }
  if (video) { const v = document.createElement("video"); Object.assign(v, { src: video, controls: true, loop: true, muted: true, autoplay: true, playsInline: true }); el.append(v); }
  if (text) { const t = document.createElement("div"); t.className = "t"; t.textContent = text; el.append(t); }
  if (actions) {
    const a = document.createElement("div"); a.className = "acts";
    for (const [label, fn] of actions) { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; a.append(b); }
    el.append(a);
  }
  const tm = document.createElement("div"); tm.className = "time"; tm.textContent = time || now(); el.append(tm);
  chat.append(el); scroll();
  return el;
}

function sys(text) {
  const el = document.createElement("div"); el.className = "sys"; el.textContent = text; chat.append(el); scroll();
}

function typing() {
  const el = document.createElement("div");
  el.className = "msg bot typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  chat.append(el); scroll();
  return el;
}

function setAttach(blob) {
  attached = blob;
  $("preview").style.display = blob ? "flex" : "none";
  if (blob) { $("preview").querySelector("img").src = objUrl(blob); $("text").focus(); }
}

function setModel(m, announce = true) {
  model = m;
  $("mname").textContent = m.nome;
  $("text").placeholder = m.aceita === "imagem" ? "Anexe uma imagem e diga o que mudar" : `Descreva o ${m.tipo === "vídeo" ? "vídeo" : "que criar"}`;
  if (announce) sys(`Modelo: ${m.nome} — ${m.desc}`);
}

// ---------- Escolha de modelo ----------
function renderModels() {
  const box = $("models"); box.replaceChildren();
  for (const m of MODELS) {
    const b = document.createElement("button");
    b.className = "opt" + (m === model ? " sel" : "");
    b.innerHTML = `<div><b></b><small></small></div>`;
    b.querySelector("b").textContent = m.nome;
    const tag = document.createElement("span"); tag.className = "tag" + (m.tipo === "vídeo" ? " v" : ""); tag.textContent = m.tipo;
    b.querySelector("b").append(tag);
    b.querySelector("small").textContent = `${m.desc} · aceita ${m.aceita === "ambos" ? "texto ou imagem" : m.aceita}`;
    b.onclick = () => { $("picker").close(); $("custom").value = ""; if (m !== model) setModel(m); };
    box.append(b);
  }
}
$("pick").onclick = () => { renderModels(); $("picker").showModal(); };
$("okpick").onclick = () => {
  const sp = $("custom").value.trim();
  $("picker").close();
  if (!/^[\w.-]+\/[\w.-]+$/.test(sp)) return;
  const m = { id: "custom:" + sp, nome: sp.split("/")[1], tipo: "imagem/vídeo", aceita: "ambos", space: sp, desc: "Space personalizado" };
  MODELS.push(m); setModel(m);
};

// ---------- Chamada adaptativa à API do Space ----------
// Lê a API do Space (view_api) e preenche só os parâmetros que existem nele.
async function getClient(space) {
  const token = $("token").value.trim();
  const key = space + (token ? ":t" : "");
  // record_history: false — a biblioteca guardaria o histórico de prompts no navegador.
  if (!clients[key]) clients[key] = await Client.connect(space, { record_history: false, ...(token ? { token } : {}) });
  return clients[key];
}

const PROMPT_NAMES = /^(prompt|text|positive_prompt|prompt_text|input_text|text_prompt|description|caption|instruction)$/i;
const isImageParam = (p) => /image/i.test(p.component || "") || (/image/i.test(p.parameter_name) && !/size|width|height|guidance|strength|num/i.test(p.parameter_name));

function findPrompt(params) {
  return params.find((p) => PROMPT_NAMES.test(p.parameter_name))
      || params.find((p) => /textbox/i.test(p.component || "") && !/negative|neg_/i.test(p.parameter_name));
}

function pickEndpoint(api, hasImage) {
  const eps = Object.entries(api.named_endpoints || {});
  let best = null, bestScore = -Infinity;
  for (const [name, ep] of eps) {
    const ps = ep.parameters || [];
    if (!findPrompt(ps)) continue;
    const img = ps.find(isImageParam);
    const outs = (ep.returns || []).map((r) => String(r.component || "").toLowerCase());
    let score = 0;
    // Prioriza funções que devolvem mídia; descarta utilitárias que só devolvem texto (ex.: "melhorar prompt").
    if (outs.some((c) => /video|image|gallery|file|model3d/.test(c))) score += 6;
    else if (outs.length && outs.every((c) => /textbox|markdown|html|json|label|number|state/.test(c))) score -= 8;
    if (/enhance|prompt|caption|translat|describe|interrogat|upscal|clear|reset|example|random/i.test(name)) score -= 5;
    if (hasImage && img) score += 3;
    if (!hasImage && img && !img.parameter_has_default) score -= 5;
    if (/^\/(infer|generate|run|predict|generate_video|generate_image|text_to_video|image_to_video)/.test(name)) score += 2;
    if (hasImage && /image_to_video|i2v|img2/.test(name)) score += 2;
    if (!hasImage && /text_to_video|t2v|txt2/.test(name)) score += 2;
    if (/^\/(lambda|update|change|reset|clear|random|example|load|on_)/.test(name)) score -= 4;
    score -= ps.filter((p) => !p.parameter_has_default).length * 0.1;
    if (score > bestScore) { best = [name, ep]; bestScore = score; }
  }
  return best;
}

// Lê as opções de um campo de lista (Dropdown/Radio) a partir da API do Space.
function choicesOf(p) {
  const out = [];
  const t = p.python_type?.type || "";
  for (const m of t.matchAll(/'([^']*)'|"([^"]*)"/g)) out.push(m[1] ?? m[2]);
  const en = p.type?.enum || p.python_type?.enum;
  if (Array.isArray(en)) out.push(...en.map(String));
  return out;
}

function buildArgs(params, prompt, imageBlob) {
  const args = {};
  const pp = findPrompt(params); args[pp.parameter_name] = prompt;
  const imgP = params.find(isImageParam);
  if (imageBlob && imgP) args[imgP.parameter_name] = handle_file(imageBlob);
  const seedTxt = $("seed").value.trim();
  const stepsTxt = $("steps").value.trim();
  const [w, h] = $("size").value.split("x").map(Number);
  for (const p of params) {
    const n = p.parameter_name;
    if (/^seed(_value)?$/i.test(n) && seedTxt) args[n] = Number(seedTxt);
    else if (/random/i.test(n) && /seed/i.test(n)) args[n] = !seedTxt;
    else if (/^(num_inference_steps|steps|num_steps|step)$/i.test(n) && stepsTxt && /number|slider/i.test(p.component || "")) args[n] = Number(stepsTxt);
    else if (/^width$/i.test(n) && model.tipo === "imagem") args[n] = w;
    else if (/^height$/i.test(n) && model.tipo === "imagem") args[n] = h;
  }
  // Campos de escolha de estilo/modelo base (ex.: AnimateDiff "base"): prefere a opção realista.
  if ($("realista").checked) {
    for (const p of params) {
      const n = p.parameter_name || "";
      if (n in args || !/base|style|estilo|model|checkpoint/i.test(n)) continue;
      const opts = choicesOf(p);
      const real = opts.find((o) => /realis|epic.?real|photo|real.?vis|juggernaut/i.test(o));
      if (real) args[n] = real;
    }
  }
  // Entradas de mídia opcionais na prática (ex.: video_input do CogVideoX) vão vazias.
  for (const p of params) {
    const n = p.parameter_name;
    if (n && !(n in args) && !p.parameter_has_default && /video|image|file|audio|gallery/i.test(p.component || "")) args[n] = null;
  }
  const missing = params.filter((p) => !(p.parameter_name in args) && !p.parameter_has_default).map((p) => p.parameter_name);
  if (missing.length) throw new Error(`este Space pede campos que o app não sabe preencher: ${missing.join(", ")}`);
  return args;
}

// Acha o primeiro arquivo (imagem ou vídeo) na resposta, em qualquer formato.
// Junta todos os arquivos da resposta e prefere vídeo (alguns Spaces devolvem vídeo + GIF + prévia).
function findFiles(x, acc = []) {
  if (!x || typeof x !== "object") return acc;
  if (typeof x.url === "string") { acc.push(x); return acc; }
  for (const v of Array.isArray(x) ? x : Object.values(x)) findFiles(v, acc);
  return acc;
}
const VIDEO_RE = /\.(mp4|webm|mov|mkv|avi)(\?|$)/i;
function findFile(x) {
  const files = findFiles(x);
  return files.find((f) => VIDEO_RE.test(f.url) || VIDEO_RE.test(f.orig_name || f.path || "") || /video/.test(f.mime_type || "")) || files[0] || null;
}
const findSeed = (data) => data.find((d) => typeof d === "number");

// Cada etapa marca onde falhou, para o erro dizer exatamente o que aconteceu.
async function step(nome, fn) {
  try { return await fn(); }
  catch (e) { const err = new Error(`${nome}: ${e?.message || e}`); err.etapa = nome; throw err; }
}

// ---------- Outros provedores (cota própria, fora do Hugging Face) ----------
async function blobOrRemote(url, init) {
  // Tenta baixar; se o navegador não puder (CORS), mostra direto do servidor.
  try {
    const r = await fetch(url, { cache: "no-store", ...init });
    if (!r.ok) { const t = (await r.text().catch(() => "")).slice(0, 200); throw new Error(`HTTP ${r.status} ${t}`); }
    return { blob: await r.blob() };
  } catch (e) {
    if (/^HTTP /.test(e.message) || init?.headers) throw e;
    return { remoteUrl: url, video: false };
  }
}

async function genPollinations(prompt) {
  const [w, h] = $("size").value.split("x").map(Number);
  const seedTxt = $("seed").value.trim();
  const seed = seedTxt ? Number(seedTxt) : Math.floor(Math.random() * 1e9);
  const key = $("pollkey").value.trim();
  const q = new URLSearchParams({ model: "flux", width: w, height: h, seed, nologo: "true", enhance: "false", safe: "false" });
  const enc = encodeURIComponent(prompt);
  const r = key
    ? await blobOrRemote(`https://gen.pollinations.ai/image/${enc}?${q}`, { headers: { Authorization: `Bearer ${key}` } })
    : await blobOrRemote(`https://image.pollinations.ai/prompt/${enc}?${q}`);
  return { ...r, seed };
}

async function genTogether(prompt) {
  const key = $("togkey").value.trim();
  if (!key) throw new Error("coloque a chave da Together AI em Ajustes (⋮)");
  const [w, h] = $("size").value.split("x").map(Number);
  const seedTxt = $("seed").value.trim();
  const body = { model: "black-forest-labs/FLUX.1-schnell-Free", prompt, width: w, height: h, steps: 4, n: 1, response_format: "b64_json" };
  if (seedTxt) body.seed = Number(seedTxt);
  const r = await fetch("https://api.together.xyz/v1/images/generations", {
    method: "POST", headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`HTTP ${r.status} ${j?.error?.message || JSON.stringify(j).slice(0, 200)}`);
  const d = j?.data?.[0] || {};
  if (d.b64_json) {
    const bytes = Uint8Array.from(atob(d.b64_json), (c) => c.charCodeAt(0));
    return { blob: new Blob([bytes], { type: "image/png" }), seed: body.seed };
  }
  if (d.url) return { ...(await blobOrRemote(d.url)), seed: body.seed };
  throw new Error("a Together respondeu sem imagem");
}

async function generate(m, prompt, inputBlob) {
  if (m.prov === "pollinations") return step("Pollinations", () => genPollinations(prompt));
  if (m.prov === "together") return step("Together", () => genTogether(prompt));
  const client = await step("conectar ao Space", () => getClient(m.space));
  const api = await step("ler a API do Space", () => client.view_api());
  if (!api) throw new Error("ler a API do Space: o Space não informou sua API");
  const picked = pickEndpoint(api, !!inputBlob);
  if (!picked) throw new Error("não encontrei na API deste Space uma função que receba texto");
  const [endpoint, ep] = picked;
  const args = buildArgs(ep.parameters, prompt, inputBlob);
  const res = await step(`gerar (${endpoint})`, () => client.predict(endpoint, args));
  const file = findFile(res.data);
  if (!file) throw new Error("o Space respondeu sem imagem nem vídeo");
  const seed = findSeed(res.data);
  const videoUrl = /\.(mp4|webm|mov|mkv|avi)(\?|$)/i.test(file.url) || /\.(mp4|webm|mov|mkv|avi)$/i.test(file.orig_name || file.path || "") || /video/.test(file.mime_type || "");
  try {
    const blob = await (await fetch(file.url, { cache: "no-store" })).blob();
    // O servidor às vezes manda tipo genérico (octet-stream): decide pelo nome do arquivo.
    const generic = !/^(image|video)\//.test(blob.type);
    const typed = generic || (videoUrl && !blob.type.startsWith("video/")) ? new Blob([blob], { type: videoUrl ? "video/mp4" : (blob.type.startsWith("image/") ? blob.type : "image/png") }) : blob;
    return { blob: typed, seed };
  } catch {
    // Sem permissão para baixar pelo app: mostra direto do servidor do Space.
    return { remoteUrl: file.url, video: videoUrl, seed };
  }
}

// ---------- Fluxo da conversa ----------
function blocked(prompt, hasImage, fictionalImage) {
  const sexual = SEXUAL.test(prompt) || UNDRESS.test(prompt);
  if (MINOR.test(prompt) && sexual) return "Não posso gerar conteúdo sexual envolvendo menores.";
  if (hasImage && !fictionalImage && sexual) return "Com foto enviada pelo clipe não gero nudez, despir ou conteúdo sexual — o app não consegue saber se é uma pessoa real (marca d\u2019água ou assinatura de IA não comprova). Para isso: gere a pessoa aqui só com texto e use “Editar” ou “Animar” na imagem gerada — essas são liberadas.";
  return null;
}

// Escolhe o modelo certo para o que foi enviado (ex.: imagem anexada num modelo só de texto → Kontext).
function route(hasImage) {
  if (hasImage && model.aceita === "texto") {
    if (model.tipo === "imagem") return { m: MODELS.find((x) => x.id === "flux-kontext"), note: "Imagem anexada → usando FLUX.1 Kontext para editar." };
    return { m: MODELS.find((x) => x.id === "ltx"), note: `${model.nome} não aceita imagem → usando LTX-Video.` };
  }
  if (!hasImage && model.aceita === "imagem") return { err: `${model.nome} edita imagens: toque no clipe e anexe uma.` };
  return { m: model };
}

// ---------- Histórico opcional (só grava se o usuário ligar) ----------
const HIST_KEY = "uxia_keep_history";
let keepHistory = false;
try { keepHistory = localStorage.getItem(HIST_KEY) === "1"; } catch {}
let log = [];
const subText = () => keepHistory ? "online · conversa salva neste aparelho" : "online · nada é salvo neste aparelho";

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("uxia", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("chat");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function saveLog() {
  try {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction("chat", "readwrite"); tx.objectStore("chat").put(log, "log"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    db.close();
  } catch {}
}
async function loadLog() {
  try {
    const db = await idb();
    const v = await new Promise((res, rej) => { const r = db.transaction("chat").objectStore("chat").get("log"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    db.close();
    return Array.isArray(v) ? v : [];
  } catch { return []; }
}
function wipeLog() { try { indexedDB.deleteDatabase("uxia"); } catch {} }
function record(entry) {
  log.push({ ...entry, time: now() });
  if (log.length > 200) log = log.slice(-200);
  if (keepHistory) saveLog();
}

function showResult(r, time) {
  const m = MODELS.find((x) => x.id === r.modelId) || { id: r.modelId, nome: r.nome };
  const url = r.blob ? objUrl(r.blob) : r.remoteUrl;
  const ext = ((r.blob?.type || "").split("/")[1] || (r.video ? "mp4" : "webp")).replace("jpeg", "jpg").replace("quicktime", "mov");
  const actions = [["Salvar", () => {
    if (r.fictional && r.blob) rememberFictional(r.blob);
    const a = document.createElement("a"); a.href = url; a.download = `${m.id}-${r.seed ?? Date.now()}.${ext}`; a.click();
  }]];
  if (!r.video && r.blob) {
    actions.push(["Editar", () => { setModel(MODELS.find((x) => x.id === "flux-kontext")); setAttach(r.blob); }]);
    actions.push(["Animar", () => { setModel(MODELS.find((x) => x.id === "ltx")); setAttach(r.blob); }]);
  }
  bubble("bot", { [r.video ? "video" : "img"]: url, text: r.info, actions, time });
}

function replay(entries) {
  for (const e of entries) {
    if (e.t === "me") bubble("me", { text: e.text, img: e.blob ? objUrl(e.blob) : null, time: e.time });
    else if (e.t === "err") bubble("bot err", { text: e.text, time: e.time });
    else if (e.t === "sys") sys(e.text);
    else if (e.t === "res") { if (e.fictional && e.blob) FICTIONAL.add(e.blob); showResult(e, e.time); }
  }
}

async function send() {
  const prompt = $("text").value.trim();
  if (!prompt) return;
  const input = attached;
  bubble("me", { text: prompt, img: input ? objUrl(input) : null });
  record({ t: "me", text: prompt, blob: input || null });
  const fail = (text) => { bubble("bot err", { text }); record({ t: "err", text }); };
  $("text").value = ""; autosize(); setAttach(null);

  const fictionalInput = !!input && FICTIONAL.has(input);
  const why = blocked(prompt, !!input, fictionalInput);
  if (why) { fail(why); return; }
  const r = route(!!input);
  if (r.err) { fail(r.err); return; }
  if (r.note) { sys(r.note); record({ t: "sys", text: r.note }); }
  let m = r.m;

  $("send").disabled = true;
  $("sub").textContent = m.tipo === "vídeo" ? `${m.nome} gerando vídeo… (pode levar minutos)` : `${m.nome} gerando…`;
  const dots = typing();
  const t0 = performance.now();
  try {
    let out;
    try {
      out = await generate(m, prompt, input);
    } catch (e) {
      // Cota do Hugging Face acabou (ou Space fora): tenta os outros provedores, só para texto → imagem.
      const msg = String(e?.message || e);
      const canFallback = $("autofb").checked && !input && m.tipo === "imagem" && !m.prov
        && /quota|exceeded|ZeroGPU|failed to fetch|networkerror|load failed|metadata/i.test(msg);
      if (!canFallback) throw e;
      let last = e, prev = m.nome;
      for (const id of FALLBACK) {
        const alt = MODELS.find((x) => x.id === id);
        if (alt.prov === "together" && !$("togkey").value.trim()) continue;
        sys(`${prev} indisponível (cota/conexão) → tentando ${alt.nome}…`);
        prev = alt.nome;
        $("sub").textContent = `${alt.nome} gerando…`;
        try { out = await generate(alt, prompt, null); m = alt; break; }
        catch (e2) { last = e2; }
      }
      if (!out) throw last;
    }
    const { blob, remoteUrl, video: remoteVideo, seed } = out;
    dots.remove();
    const secs = ((performance.now() - t0) / 1000).toFixed(0);
    const fictional = !input || fictionalInput;
    if (blob && fictional) FICTIONAL.add(blob);
    const res = { t: "res", fictional, modelId: m.id, nome: m.nome, blob: blob || null, remoteUrl: blob ? null : remoteUrl,
      video: blob ? isVideo(blob) : remoteVideo, seed, info: `${m.nome} · ${secs}s${seed != null ? " · seed " + seed : ""}` };
    showResult(res);
    record(res);
  } catch (e) {
    dots.remove();
    const msg = String(e?.message || e);
    fail(/quota|exceeded|ZeroGPU/i.test(msg)
      ? ($("token").value.trim()
          ? `Cota de GPU da sua conta Hugging Face esgotada por agora. Ela volta sozinha com o tempo; FLUX.1 [schnell] gasta bem menos. O Hugging Face PRO dá várias vezes mais cota.\n(Hugging Face: ${msg.replace(/^gerar \([^)]*\): /, "").slice(0, 220)})`
          : `Cota gratuita esgotada por agora. Coloque seu token do Hugging Face em Ajustes (⋮) para usar a cota da sua conta, ou tente mais tarde.\n(Hugging Face: ${msg.replace(/^gerar \([^)]*\): /, "").slice(0, 220)})`)
      : /metadata could not be loaded|could not resolve|not found|paused|sleeping|runtime error/i.test(msg)
        ? `O Space de ${m.nome} (${m.space}) está fora do ar, pausado ou mudou de endereço. Escolha outro modelo ou informe outro Space no seletor.`
        : /failed to fetch|networkerror|load failed/i.test(msg)
          ? `Sem resposta do servidor de ${m.nome} ao ${e.etapa || "conectar"}. O Space pode estar pausado, lotado ou fora do ar. Para descobrir o motivo: ⋮ → 🔍 Testar conexão.\n(${VERSAO} · detalhe: ${msg})`
          : `Não consegui gerar com ${m.nome}${/^(Pollinations|Together):/.test(msg) ? " nem com os outros provedores" : ""}: ${msg}`);
  } finally {
    $("send").disabled = false;
    $("sub").textContent = subText();
  }
}

function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }

$("text").addEventListener("input", autosize);
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches) { e.preventDefault(); send(); } });
$("send").onclick = send;
$("clip").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0]; $("file").value = "";
  if (!f) return;
  if (await isKnownFictional(f)) { FICTIONAL.add(f); sys("Imagem reconhecida: gerada pelo UXIA (fictícia)."); }
  setAttach(f);
};
$("unattach").onclick = () => setAttach(null);
$("gear").onclick = () => $("settings").showModal();
// Token salvo só se o usuário marcar "Lembrar" (única gravação do app no aparelho).
const TOKEN_KEY = "uxia_hf_token";
const KEY_FIELDS = { token: TOKEN_KEY, pollkey: "uxia_poll_key", togkey: "uxia_together_key" };
function saveTokenPref() {
  for (const [id, key] of Object.entries(KEY_FIELDS)) {
    const v = $(id).value.trim();
    try { ($("remember").checked && v) ? localStorage.setItem(key, v) : localStorage.removeItem(key); } catch {}
  }
}
for (const [id, key] of Object.entries(KEY_FIELDS)) {
  try { const v = localStorage.getItem(key); if (v) { $(id).value = v; $("remember").checked = true; } } catch {}
}
$("keephist").checked = keepHistory;
$("okset").onclick = () => {
  saveTokenPref();
  const want = $("keephist").checked;
  if (want !== keepHistory) {
    keepHistory = want;
    try { want ? localStorage.setItem(HIST_KEY, "1") : localStorage.removeItem(HIST_KEY); } catch {}
    if (want) { saveLog(); sys("A conversa agora fica salva neste aparelho. A lixeira apaga tudo."); }
    else { wipeLog(); sys("Histórico apagado do aparelho. A conversa volta a ficar só na memória."); }
    $("sub").textContent = subText();
  }
  $("settings").close();
};

// Diagnóstico: testa cada etapa da conexão com o Space e mostra o resultado no chat.
async function probe(url, opts = {}) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, { cache: "no-store", ...opts });
    let body = "";
    try { body = (await r.text()).slice(0, 300); } catch {}
    return { ok: r.ok, status: r.status, body, ms: Math.round(performance.now() - t0) };
  } catch (e) {
    return { ok: false, status: "ERRO", body: String(e?.message || e), ms: Math.round(performance.now() - t0) };
  }
}
$("diag").onclick = async () => {
  $("settings").close();
  const sp = model.space;
  const token = $("token").value.trim();
  const auth = token ? { headers: { Authorization: `Bearer ${token}` } } : {};
  sys(`Testando conexão com ${sp}…`);
  const lines = [`Diagnóstico de ${sp} (${navigator.onLine ? "online" : "offline"}, token: ${token ? "sim" : "não"})`];
  const info = await probe(`https://huggingface.co/api/spaces/${sp}`, auth);
  let stage = "?", sdk = "?";
  try { const j = await (await fetch(`https://huggingface.co/api/spaces/${sp}`, { cache: "no-store", ...auth })).json(); stage = j?.runtime?.stage ?? "?"; sdk = `${j?.sdk ?? "?"} ${j?.sdkVersion ?? ""}`.trim(); } catch {}
  lines.push(`1. Dados do Space: ${info.status} (${info.ms}ms) · estado: ${stage} · sdk: ${sdk}`);
  const host = await probe(`https://huggingface.co/api/spaces/${sp}/host`, auth);
  let h = "";
  try { h = JSON.parse(host.body).host || ""; } catch {}
  lines.push(`2. Endereço: ${host.status} (${host.ms}ms) ${h || host.body.slice(0, 120)}`);
  if (h) {
    const c1 = await probe(`${h}/config`);
    lines.push(`3. Config sem credenciais: ${c1.status} (${c1.ms}ms) ${c1.ok ? "" : c1.body.slice(0, 120)}`);
    const c2 = await probe(`${h}/config`, { credentials: "include", ...auth });
    lines.push(`4. Config com credenciais: ${c2.status} (${c2.ms}ms) ${c2.ok ? "" : c2.body.slice(0, 120)}`);
    const i1 = await probe(`${h}/gradio_api/info`);
    lines.push(`5. API (gradio_api/info): ${i1.status} (${i1.ms}ms)`);
  }
  try { await getClient(sp); lines.push("6. Conexão pela biblioteca: OK"); }
  catch (e) { lines.push(`6. Conexão pela biblioteca: ${String(e?.message || e).slice(0, 160)}`); }
  bubble("bot", { text: lines.join("\n") });
};
$("clear").onclick = () => {
  for (const u of urls) URL.revokeObjectURL(u);
  urls.clear(); chat.replaceChildren(); setAttach(null);
  log = []; if (keepHistory) saveLog();
  hello();
};

function hello() {
  sys(`UXIA ${VERSAO} · ${keepHistory ? "conversa salva neste aparelho (a lixeira apaga)" : "conversa só na memória: ao fechar, tudo some"}. Use “Salvar” para baixar.${$("remember").checked ? " Token salvo neste aparelho." : ""}`);
  bubble("bot", { text: "Oi! Toque no nome do modelo lá em cima para escolher (imagem ou vídeo). Escreva o que quer criar — ou anexe uma imagem pelo clipe e diga o que fazer com ela." });
}
setModel(model, false);
$("sub").textContent = subText();
hello();
if (keepHistory) loadLog().then((saved) => { log = saved; replay(saved); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
